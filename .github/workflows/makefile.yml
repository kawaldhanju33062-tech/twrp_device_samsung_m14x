name: PBRP Build - M14x (Fixed Dependencies)

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  MANIFEST_BRANCH: android-12.1
  DEVICE_NAME: m14x
  DEVICE_PATH: device/samsung/m14x
  COMMON_PATH: device/samsung/s5e8535-common
  LUNCH_NAME: pb_m14x-eng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Setup Legacy Repositories (For Python2 & Libncurses5)
        run: |
          sudo add-apt-repository "deb http://archive.ubuntu.com/ubuntu/ focal universe"
          sudo add-apt-repository "deb http://archive.ubuntu.com/ubuntu/ focal main"
          sudo apt update

      - name: Install Dependencies
        run: |
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools tar zip \
          zlib1g-dev python2 python3 libncurses5

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync PBRP Source
        run: |
          mkdir work && cd work
          repo init -u ${{ env.MANIFEST }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Trees
        run: |
          cd work
          git clone https://github.com/AshutoshCodeSpace/twrp_device_samsung_m14x ${{ env.DEVICE_PATH }}
          git clone https://github.com/s5e8535/twrp_device_samsung_s5e8535-common ${{ env.COMMON_PATH }}

      - name: Patch Tree for PitchBlack
        run: |
          cd work/${{ env.DEVICE_PATH }}
          # Rename the lunch makefile if it exists
          if [ -f twrp_m14x.mk ]; then mv twrp_m14x.mk pb_m14x.mk; fi
          
          # Replace strings to point to the new PBRP lunch target
          sed -i 's/twrp_m14x/pb_m14x/g' AndroidProducts.mk
          sed -i 's/twrp_/pb_/g' pb_m14x.mk || sed -i 's/twrp_/pb_/g' omni_m14x.mk
          
          # Force PBRP Identity
          echo "PB_RECOVERY_DEVICE := m14x" >> BoardConfig.mk
          echo "PB_MAINTAINER := GitHubAction" >> BoardConfig.mk

      - name: Build PBRP
        run: |
          cd work
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch ${{ env.LUNCH_NAME }}
          mka pbrp -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-M14x-Build
          path: |
            work/out/target/product/m14x/PitchBlack-*.zip
            work/out/target/product/m14x/recovery.img
            
