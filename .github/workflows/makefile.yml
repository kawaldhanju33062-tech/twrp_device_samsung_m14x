
name: Build PBRP m14x
on:
  workflow_dispatch:

jobs:
  build:
    # Changed to ubuntu-latest to avoid the "Waiting for runner" hang
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git-core libssl-dev python3 repo libncurses5 zip unzip curl git lz4 python-is-python3

      - name: Sync PBRP Source
        run: |
          mkdir pbrp && cd pbrp
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          
          # Initialize PBRP Manifest
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1 --depth=1
          
          # Create Local Manifest to pull your specific trees
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/m14x.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="kawaldhanju33062-tech/twrp_device_samsung_m14x" path="device/samsung/m14x" remote="github" revision="main" />
            <project name="kawaldhanju33062-tech/twrp_device_samsung_s5e8535-common" path="device/samsung/s5e8535-common" remote="github" revision="main" />
          </manifest>
          EOF
          
          # Sync with optimized thread count
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build PBRP
        run: |
          cd pbrp
          # Essential flags for Samsung builds
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          
          . build/envsetup.sh
          
          # Ensure this matches your PRODUCT_NAME in pb_m14x.mk
          lunch pb_m14x-eng
          
          # Use j8 for faster compilation
          mka pbrp -j$(nproc --all)

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-m14x-Build
          path: |
             pbrp/out/target/product/m14x/PBRP*.zip
             pbrp/out/target/product/m14x/recovery.img
             
