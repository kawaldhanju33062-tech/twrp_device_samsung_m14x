name: PBRP Build for M146B (m14x)

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  MANIFEST_BRANCH: android-12.1
  DEVICE_NAME: m14x
  DEVICE_PATH: device/samsung/m14x
  COMMON_PATH: device/samsung/s5e8535-common
  LUNCH_NAME: pb_m14x-eng

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y gperf gcc-multilib g++-multilib lib32ncurses5-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools git repo

      - name: Sync Source
        run: |
          mkdir ~/pbrp && cd ~/pbrp
          repo init -u ${{ env.MANIFEST }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Trees
        run: |
          cd ~/pbrp
          git clone https://github.com/AshutoshCodeSpace/twrp_device_samsung_m14x ${{ env.DEVICE_PATH }}
          git clone https://github.com/s5e8535/twrp_device_samsung_s5e8535-common ${{ env.COMMON_PATH }}

      - name: Transform TWRP Tree to PBRP
        run: |
          cd ~/pbrp/${{ env.DEVICE_PATH }}
          # Rename the main makefile
          mv twrp_m14x.mk pb_m14x.mk || mv twrp_m14x.mk omni_m14x.mk
          
          # Replace 'twrp_' with 'pb_' in all makefiles
          sed -i 's/twrp_/pb_/g' pb_m14x.mk AndroidProducts.mk
          
          # Add PBRP specific flags to BoardConfig.mk
          echo "PB_RECOVERY_DEVICE := m14x" >> BoardConfig.mk
          echo "PB_MAINTAINER := YourName" >> BoardConfig.mk

      - name: Build Recovery
        run: |
          cd ~/pbrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch ${{ env.LUNCH_NAME }}
          mka precoveryimage -j$(nproc --all)

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-M146B
          path: |
             ~/pbrp/out/target/product/m14x/PitchBlack*.zip
             ~/pbrp/out/target/product/m14x/recovery.img
             
