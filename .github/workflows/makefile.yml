name: PBRP Build - M146B (m14x)

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  MANIFEST_BRANCH: android-12.1
  DEVICE_PATH: device/samsung/m14x
  COMMON_PATH: device/samsung/s5e8535-common
  LUNCH_NAME: pb_m14x-eng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool \
          libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool \
          squashfs-tools tar zip zlib1g-dev python3
          
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p ~/legacy_libs && cd ~/legacy_libs
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i *.deb || sudo apt -f install -y

      - name: Setup Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync PBRP Source
        run: |
          mkdir work && cd work
          repo init -u ${{ env.MANIFEST }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Trees
        run: |
          cd work
          git clone https://github.com/AshutoshCodeSpace/twrp_device_samsung_m14x ${{ env.DEVICE_PATH }}
          git clone https://github.com/s5e8535/twrp_device_samsung_s5e8535-common ${{ env.COMMON_PATH }}

      - name: Transform Trees to PBRP
        run: |
          # --- Transform Device Tree ---
          cd work/${{ env.DEVICE_PATH }}
          [ -f twrp.dependencies ] && mv twrp.dependencies pb.dependencies
          [ -f twrp_m14x.mk ] && mv twrp_m14x.mk pb_m14x.mk
          
          sed -i 's/twrp_m14x/pb_m14x/g' AndroidProducts.mk
          sed -i 's/PRODUCT_NAME := twrp_m14x/PRODUCT_NAME := pb_m14x/g' pb_m14x.mk
          
          # --- Transform Common Tree ---
          cd ../s5e8535-common
          # Rename common makefile if exists
          [ -f twrp_s5e8535.mk ] && mv twrp_s5e8535.mk pb_s5e8535.mk
          
          # Change TWRP inheritance to PBRP
          find . -type f -name "*.mk" -exec sed -i 's|vendor/twrp/config/common.mk|vendor/pb/config/common.mk|g' {} +
          
          # Fix "commands commence" error by ensuring newlines at end of all .mk files
          find . -type f -name "*.mk" -exec sed -i '$a\\' {} +

      - name: Inject PBRP Configuration
        run: |
          cd work/${{ env.DEVICE_PATH }}
          # Append PBRP specific flags to BoardConfig.mk safely
          echo -e "\n# PBRP Configuration\nPB_RECOVERY_DEVICE := m14x" >> BoardConfig.mk
          echo "PB_MAINTAINER := GitHubAction" >> BoardConfig.mk
          echo "PB_DEVICE_MODEL := SM-M146B" >> BoardConfig.mk
          # Samsung fix for storage
          echo "BOARD_HAS_NO_REAL_SDCARD := true" >> BoardConfig.mk
          # Ensure BoardConfig also ends with a newline
          sed -i '$a\\' BoardConfig.mk

      - name: Build PBRP
        run: |
          cd work
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch ${{ env.LUNCH_NAME }}
          mka pbrp -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-M146B-m14x
          path: |
            work/out/target/product/m14x/PitchBlack-*.zip
            work/out/target/product/m14x/recovery.img
            
