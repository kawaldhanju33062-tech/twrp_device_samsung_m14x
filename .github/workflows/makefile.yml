name: Build PBRP m14x
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          # Add Ubuntu 22.04 (Jammy) for legacy libtinfo5 support
          sudo add-apt-repository 'deb http://azure.archive.ubuntu.com/ubuntu/ jammy main universe'
          sudo apt-get update
          sudo apt-get install -y bc build-essential git-core libssl-dev python3-minimal repo libncurses-dev zip unzip curl git lz4 python-is-python3 libtinfo5

      - name: Sync PBRP Source
        run: |
          mkdir pbrp && cd pbrp
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          
          # 1. Install a local, writable repo tool to fix the /usr/bin/repo error
          curl https://storage.googleapis.com/git-repo-downloads/repo > repo
          chmod a+x repo
          export PATH=$(pwd):$PATH
          
          # 2. Initialize PBRP Manifest
          ./repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1 --depth=1
          
          # 3. Create Local Manifest
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/m14x.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="kawaldhanju33062-tech/twrp_device_samsung_m14x" path="device/samsung/m14x" remote="github" revision="twrp-12.1" />
            <project name="kawaldhanju33062-tech/twrp_device_samsung_s5e8535-common" path="device/samsung/s5e8535-common" remote="github" revision="main" />
          </manifest>
          EOF
          
          # 4. Sync with high thread count
          ./repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build PBRP
        run: |
          cd pbrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          . build/envsetup.sh
          
          # Lunch using your device codename
          lunch pb_m14x-eng
          
          mka pbrp -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-m14x-Build
          path: |
             pbrp/out/target/product/m14x/PBRP*.zip
             pbrp/out/target/product/m14x/recovery.img
             
