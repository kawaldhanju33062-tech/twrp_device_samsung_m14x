name: PBRP Build - M146B (m14x)

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  MANIFEST_BRANCH: android-12.1
  DEVICE_PATH: device/samsung/m14x
  COMMON_PATH: device/samsung/s5e8535-common
  LUNCH_NAME: pb_m14x-eng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool \
          libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool \
          squashfs-tools tar zip zlib1g-dev python3
          
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p ~/legacy_libs && cd ~/legacy_libs
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
          sudo dpkg -i *.deb || sudo apt -f install -y

      - name: Setup Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Sync PBRP Source
        run: |
          mkdir work && cd work
          repo init -u ${{ env.MANIFEST }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Trees
        run: |
          cd work
          git clone https://github.com/AshutoshCodeSpace/twrp_device_samsung_m14x ${{ env.DEVICE_PATH }}
          git clone https://github.com/s5e8535/twrp_device_samsung_s5e8535-common ${{ env.COMMON_PATH }}

      - name: Verify Samsung Prebuilts
        run: |
          echo "Checking for Samsung specific prebuilt files..."
          KERNEL="work/${{ env.DEVICE_PATH }}/prebuilt/Image"
          DTBO="work/${{ env.DEVICE_PATH }}/prebuilt/recovery_dtbo"
          
          if [ ! -f "$KERNEL" ]; then
            echo "ERROR: Kernel not found at $KERNEL. Please ensure it is in the 'prebuilt' folder."
            exit 1
          fi
          
          if [ ! -f "$DTBO" ]; then
            echo "ERROR: DTBO image not found at $DTBO"
            exit 1
          fi
          echo "Prebuilt files verified."

      - name: Transform Trees to PBRP
        run: |
          # --- Transform Device Tree (m14x) ---
          cd work/${{ env.DEVICE_PATH }}
          [ -f twrp.dependencies ] && mv twrp.dependencies pb.dependencies
          [ -f twrp_m14x.mk ] && mv twrp_m14x.mk pb_m14x.mk
          
          # Replace twrp prefixes with pb
          sed -i 's/twrp_m14x/pb_m14x/g' AndroidProducts.mk
          sed -i 's/PRODUCT_NAME := twrp_m14x/PRODUCT_NAME := pb_m14x/g' pb_m14x.mk
          
          # CRITICAL: Fix the link to the common tree's renamed makefile
          sed -i 's/twrp_s5e8535.mk/pb_s5e8535.mk/g' pb_m14x.mk
          sed -i 's/twrp_s5e8535.mk/pb_s5e8535.mk/g' device.mk || true
          
          # --- Transform Common Tree (s5e8535-common) ---
          cd ../s5e8535-common
          [ -f twrp_s5e8535.mk ] && mv twrp_s5e8535.mk pb_s5e8535.mk
          
          # Change TWRP inheritance to PBRP
          find . -type f -name "*.mk" -exec sed -i 's|vendor/twrp/config/common.mk|vendor/pb/config/common.mk|g' {} +
          
          # Deep search for internal twrp_s5e8535.mk references
          find . -type f -name "*.mk" -exec sed -i 's/twrp_s5e8535.mk/pb_s5e8535.mk/g' {} +
          
          # Prevent "commands commence" error by ensuring trailing newlines
          find . -type f -name "*.mk" -exec sed -i '$a\\' {} +

      - name: Inject PBRP Configuration
        run: |
          cd work/${{ env.DEVICE_PATH }}
          # Clean injection into BoardConfig.mk
          {
            echo ""
            echo "# PitchBlack Recovery Project"
            echo "PB_RECOVERY_DEVICE := m14x"
            echo "PB_MAINTAINER := GitHubAction"
            echo "PB_DEVICE_MODEL := SM-M146B"
            echo "BOARD_HAS_NO_REAL_SDCARD := true"
          } >> BoardConfig.mk
          sed -i '$a\\' BoardConfig.mk

      - name: Build PBRP
        run: |
          cd work
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch ${{ env.LUNCH_NAME }}
          mka pbrp -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-M146B-m14x
          path: |
            work/out/target/product/m14x/PitchBlack-*.zip
            work/out/target/product/m14x/recovery.img
            
